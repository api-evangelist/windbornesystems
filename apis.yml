name: WindBorne Systems
description: WindBorne Systems operates a global constellation of long-duration Global
  Sounding Balloons and pairs that proprietary in-situ atmospheric data with WeatherMesh,
  its AI-based numerical weather forecast model. The WindBorne Data API serves real-time
  balloon observations, soundings, super-observations, constellation and flight-path
  metadata, point and gridded WeatherMesh forecasts, tropical-cyclone tracks, and
  population-weighted heating/cooling degree-day insights. Access is via a Bearer
  API key over REST, an official Python library and CLI, and a hosted Model Context
  Protocol server for AI agents.
