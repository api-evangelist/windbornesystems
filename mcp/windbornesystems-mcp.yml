    - https://api.windbornesystems.com/insights/v1/gfs/hdds

    - https://api.windbornesystems.com/insights/v1/wm-6-3km/hdds

    - https://api.windbornesystems.com/insights/v1/wm-4.5-ens-mean/hdds

    - https://api.windbornesystems.com/insights/v1/gefs/hdds'
- name: get_initialization_times
  description: 'This endpoint returns the available initialization times (model run start times) for point
