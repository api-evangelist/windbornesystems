    pressure levels, suitable for generating Skew-T diagrams and atmospheric analysis.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/point-forecast/interpolated-sounding/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/point_forecast/interpolated_sounding'
- name: get_mission_launch_site
  description: 'This endpoint allows finding the site from which that mission was launched. It accepts
    no query parameters, but requires a mission id to be passed into the url.


    Documentation: https://api.windbornesystems.com/atlas/version_1/metadata/mission-launch-site/


    Default endpoint: https://api.windbornesystems.com/atlas/v1/missions/{mission_id}/launch_site'
- name: get_point_forecast
  description: 'Retrieve point forecasts for specific geographic coordinates. This endpoint provides detailed
    weather forecasts for individual locations with high temporal resolution and multiple weather variables.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/point-forecast/point-forecast/


