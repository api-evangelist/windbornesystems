    Documentation: https://api.windbornesystems.com/forecasts/version_1/forecast-availability/run-information/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/run_information

    Endpoint options (pass one as the endpoint parameter):

    - https://api.windbornesystems.com/forecasts/v1/wm-6/run_information

    - https://api.windbornesystems.com/forecasts/v1/wm-6-3km/run_information

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-det/run_information

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-ens/run_information

    - https://api.windbornesystems.com/forecasts/v1/aifs/run_information

