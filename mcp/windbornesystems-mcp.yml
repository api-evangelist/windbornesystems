tools:
- name: get_mcp_status
  description: Return the loaded WindBorne MCP spec version and hashes. Use this to check whether a client
    has reconnected to the latest generated tool definitions. No authentication required.
- name: read_api_docs
  description: Search and read WindBorne API documentation. Returns relevant documentation pages matching
    the query. Use this to learn about available endpoints, parameters, authentication, data formats,
    and more. No authentication required.
- name: list_api_endpoints
  description: List all available WindBorne API endpoints with their methods, paths, and descriptions.
    No authentication required.
- name: add_webhook_subscription
  description: 'Add another subscription to a webhook. This endpoint accepts both PATCH and PUT. The request
    body is a single subscription object. degree_days.available: This subscription is sent after the degree
    day calculation for a model run has completed. The payload identifies the matching model run whose
    population-weighted HDD and CDD forecasts are available. events.available: Receive a notification
    when atmospheric river, heatwave, coldwave, and front products are published for a model run and can
    be queried through the Events API. By default, one notification waits for all four types from the
    same initialization. Subscribe to specific types to receive their notifications independently, without
    waiting for the others. Each notification covers a complete forecast, not one individual event or
    forecast hour. forecast_hour.available: This subscription sends a notification for each individual
    forecast output as it becomes available. The payload includes the model, initialization time, forecast
    zero, forecast hour, and the time at which the forecast is valid. initialization_time.available: The
    forecast cycle is complete when every expected forecast hour for a model run is available. The payload
    includes the model, initialization time, and forecast zero. tropical_cyclones.available: This subscription
    is sent once tropical cyclone forecasts have been published for a matching model run. The payload
    includes the model, initialization time, forecast zero, and tropical cyclone IDs even when no response
    option is configured.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/subscriptions/add-subscription/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}/subscriptions'
- name: create_webhook
  description: 'Register a destination URL for webhook deliveries and optionally configure one or more
    subscriptions. Supported subscriptions: degree_days.available: This subscription is sent after the
    degree day calculation for a model run has completed. The payload identifies the matching model run
    whose population-weighted HDD and CDD forecasts are available. events.available: Receive a notification
    when atmospheric river, heatwave, coldwave, and front products are published for a model run and can
    be queried through the Events API. By default, one notification waits for all four types from the
    same initialization. Subscribe to specific types to receive their notifications independently, without
    waiting for the others. Each notification covers a complete forecast, not one individual event or
    forecast hour. forecast_hour.available: This subscription sends a notification for each individual
    forecast output as it becomes available. The payload includes the model, initialization time, forecast
    zero, forecast hour, and the time at which the forecast is valid. initialization_time.available: The
    forecast cycle is complete when every expected forecast hour for a model run is available. The payload
    includes the model, initialization time, and forecast zero. tropical_cyclones.available: This subscription
    is sent once tropical cyclone forecasts have been published for a matching model run. The payload
    includes the model, initialization time, forecast zero, and tropical cyclone IDs even when no response
    option is configured.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/manage/create-webhook/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1'
- name: delete_webhook
  description: 'Permanently deletes the webhook and its subscriptions. This cannot be undone.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/manage/delete-webhook/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}'
- name: delete_webhook_subscription
  description: 'Removes one subscription without deleting the webhook.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/subscriptions/delete-subscription/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}/subscriptions/{subscription_id}'
- name: get_aggregated_observations
  description: 'WindBorne observations are high-frequency, at once every ten seconds, but as our balloons
    are comparatively slow-moving (relative to the distances at which weather changes), this may be excessive
    for some applications. Indeed, previous data assimilation experiments have suggested that reducing
    the resolution of the dataset helps with impact.


    Documentation: https://api.windbornesystems.com/observations/version_1/observations/super-observations/


    Default endpoint: https://api.windbornesystems.com/observations/v1/super_observations'
- name: get_all_soundings
  description: 'Discover which atmospheric soundings have been collected by WindBorne''s global balloon
    constellation. This endpoint allows you to search for soundings by time, location, altitude, and mission,
    making it easy to discover which soundings are available before fetching the full sounding data.


    Documentation: https://api.windbornesystems.com/observations/version_1/soundings/all-soundings/


    Default endpoint: https://api.windbornesystems.com/observations/v1/soundings'
- name: get_archived_initialization_times
  description: 'Returns a list of archived initialization times (model run start times) for the selected
    weather model. Results are paginated. Use page and page_size to control pagination, and order to sort
    by newest or oldest first. For archived runs, only full gridded forecast data is available.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/forecast-availability/archived-initialization-times/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/initialization_times/archive

    Endpoint options (pass one as the endpoint parameter):

    - https://api.windbornesystems.com/forecasts/v1/wm-6/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/wm-6-3km/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-det/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-ens/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/aifs/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/gfs/initialization_times/archive

    - https://api.windbornesystems.com/forecasts/v1/hrrr/initialization_times/archive'
- name: get_available_stations
  description: 'Returns the list of METAR weather stations for which MetaMesh generates station forecasts.
    Use the station IDs from this endpoint with the Point Forecast endpoint.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/forecast-availability/available-stations/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/point_forecast/stations'
- name: get_calculation_times
  description: 'Some forecast outputs are calculated after the underlying forecast data becomes available.
    This endpoint lets you check when degree day (HDD/CDD) and tropical cyclone calculations are available
    for each model initialization time, as well as which calculations are still in progress or incomplete.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/forecast-availability/calculation_times/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/{model}/calculation_times/{calculation_type}'
- name: get_cdd
  description: 'This endpoint provides opulation weighted cooling degree days (CDD) forecasts for all
    50 US states. CDD is a measure of how hot the temperature was on a given day relative to a base temperature
    of 65°F, weighted by population density to provide more accurate energy demand forecasting.


    Documentation: https://api.windbornesystems.com/insights/version_1/population-weighted/cdd/


    Default endpoint: https://api.windbornesystems.com/insights/v1/wm-6/cdds

    Endpoint options (pass one as the endpoint parameter):

    - https://api.windbornesystems.com/insights/v1/wm-6/cdds

    - https://api.windbornesystems.com/insights/v1/ecmwf-det/cdds

    - https://api.windbornesystems.com/insights/v1/ecmwf-ens/cdds

    - https://api.windbornesystems.com/insights/v1/aifs/cdds

    - https://api.windbornesystems.com/insights/v1/gfs/cdds

    - https://api.windbornesystems.com/insights/v1/wm-6-3km/cdds

    - https://api.windbornesystems.com/insights/v1/wm-4.5-ens-mean/cdds

    - https://api.windbornesystems.com/insights/v1/gefs/cdds'
- name: get_climatology
  description: 'Look up the average weather for each hour at one or more locations. By default, each value
    is the mean of ERA5 data for that calendar day and UTC hour across a historical period, called a normal
    (for example, 1991-2020). Use it as a baseline for time-specific questions, such as whether a morning
    is warmer than usual.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/context/climatology/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/climatology'
- name: get_climatology_summary
  description: 'Look up typical daily weather statistics at one or more locations. This endpoint first
    calculates each day''s high, low, precipitation total, and wind statistics in local standard time
    for each year in the selected ERA5 period, then averages those daily statistics across years. This
    preserves the typical daily range.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/context/climatology-summary/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/climatology/summary'
- name: get_constellation_status
  description: 'Extends the Flying Missions endpoint with position data, including latitude , longitude
    , altitude , and ascent_rate for each active mission.


    Documentation: https://api.windbornesystems.com/atlas/version_1/positions/constellation-status/


    Default endpoint: https://api.windbornesystems.com/atlas/v1/constellation_status'
- name: get_current_location
  description: 'Retrieve the latest known location and state for a specific mission. This endpoint requires
    a mission id in the URL path and takes no query parameters.


    Documentation: https://api.windbornesystems.com/atlas/version_1/positions/current-location/


    Default endpoint: https://api.windbornesystems.com/atlas/v1/missions/{mission_id}/current_location'
- name: get_event_context
  description: 'Return a time series of events affecting each requested coordinate, keyed by event ID
    with a summary at each time. Use those IDs with Event Detail to retrieve geometries and the full forecast.


    Documentation: https://api.windbornesystems.com/insights/version_1/events/event-context/


