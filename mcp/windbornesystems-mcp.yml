- name: get_tropical_cyclone_detail
  description: 'Fetch all available data for a model''s tropical cyclone for its latest or a requested
    initialization time. Use an operational ATCF ID or a generated ID returned by the index. See About
    the Tropical Cyclone Tracker for details about paths, landfalls, cones, and storm identification.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/tropical-cyclones/tropical-cyclone-detail/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/tropical_cyclones/{tc_id}'
- name: get_tropical_cyclone_init_times
  description: 'Pass a tropical cyclone ID and receive every initialization time where that cyclone is
    available. See About the Tropical Cyclone Tracker for details about operational and generated storm
    IDs.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/tropical-cyclones/tropical-cyclone-init-times/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/tropical_cyclones/{tc_id}/init_times'
- name: get_tropical_cyclones
  description: 'List tropical cyclones for the latest initialization time. The response is short by default.
    Set include_details=true to add each cyclone''s path, member landfalls, and ensemble-weighted cone.
    For easier use with maps use format=geojson to return map ready data. See About the Tropical Cyclone
    Tracker for details about paths, landfalls, cones, and storm identification.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/tropical-cyclones/tropical-cyclones/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/tropical_cyclones'
- name: get_tropical_cyclones_index
  description: 'This endpoint lists tropical cyclones captured across all initialization times for a model.
    Use min_time , max_time , or both to find cyclones whose lifetime overlaps the specified window. Results
    are ordered by start_time from newest to oldest. To find every initialization time that captures a
    cyclone, use the tropical cyclone initialization-times endpoint. See About the Tropical Cyclone Tracker
    for details about operational and generated storm IDs.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/tropical-cyclones/tropical-cyclones-index/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/tropical_cyclones/index'
- name: get_variables
  description: 'This endpoint returns the list of available variables for a given model, grouped by native
    and derived surface and upper-air variables, as well as the vertical levels used by the model.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/forecast-availability/variables/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/wm-6/variables

    Endpoint options (pass one as the endpoint parameter):

    - https://api.windbornesystems.com/forecasts/v1/wm-6/variables

    - https://api.windbornesystems.com/forecasts/v1/wm-6-3km/variables

    - https://api.windbornesystems.com/forecasts/v1/mm/variables

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-det/variables

    - https://api.windbornesystems.com/forecasts/v1/ecmwf-ens/variables

    - https://api.windbornesystems.com/forecasts/v1/aifs/variables

    - https://api.windbornesystems.com/forecasts/v1/gfs/variables

    - https://api.windbornesystems.com/forecasts/v1/hrrr/variables'
- name: get_weather_context
  description: 'Get a MetaMesh point forecast for each coordinate or station, with optional conditions,
    observations, and historical ERA5 averages (normals). include_climatology adds normals at every hour
    from the first to last forecast time; include_climatology_summary adds daily normals for the local
    dates covered by the forecast. Either option works on its own.


    Documentation: https://api.windbornesystems.com/forecasts/version_1/context/weather-context/


    Default endpoint: https://api.windbornesystems.com/forecasts/v1/weather_context'
- name: get_webhook
  description: 'Retrieve the full details of a single webhook, including its configuration and all subscriptions.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/manage/get-webhook/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}'
- name: list_webhooks
  description: 'Retrieve your webhook endpoints and their subscriptions, with optional filters for status,
    subscription type, and destination URL.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/manage/list-webhooks/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1'
- name: ping_webhook_subscription
  description: 'Send a test delivery to your endpoint for a specific subscription. Useful for verifying
    connectivity and confirming your server handles payloads correctly.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/debug/ping-subscription/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}/subscriptions/{subscription_id}/ping'
- name: update_webhook
  description: 'Update the core properties of a webhook. This endpoint accepts both PATCH and PUT.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/manage/update-webhook/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}'
- name: update_webhook_subscription
  description: 'Update a single subscription on a webhook. This endpoint accepts both PATCH and PUT. The
    request body is partial, so omitted fields remain unchanged. Use get_webhook first when the subscription
    type is unknown. degree_days.available: This subscription is sent after the degree day calculation
    for a model run has completed. The payload identifies the matching model run whose population-weighted
    HDD and CDD forecasts are available. events.available: Receive a notification when atmospheric river,
    heatwave, coldwave, and front products are published for a model run and can be queried through the
    Events API. By default, one notification waits for all four types from the same initialization. Subscribe
    to specific types to receive their notifications independently, without waiting for the others. Each
    notification covers a complete forecast, not one individual event or forecast hour. forecast_hour.available:
    This subscription sends a notification for each individual forecast output as it becomes available.
    The payload includes the model, initialization time, forecast zero, forecast hour, and the time at
    which the forecast is valid. initialization_time.available: The forecast cycle is complete when every
    expected forecast hour for a model run is available. The payload includes the model, initialization
    time, and forecast zero. tropical_cyclones.available: This subscription is sent once tropical cyclone
    forecasts have been published for a matching model run. The payload includes the model, initialization
    time, forecast zero, and tropical cyclone IDs even when no response option is configured.


    Documentation: https://api.windbornesystems.com/webhooks/version_1/subscriptions/update-subscription/


    Default endpoint: https://api.windbornesystems.com/webhooks/v1/{id}/subscriptions/{subscription_id}'
tools_count: 48
